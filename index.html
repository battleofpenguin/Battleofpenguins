  <body>
    <div id="root"></div>
    <noscript>
      <main style="font-family:sans-serif;max-width:700px;margin:60px auto;padding:0 24px;color:#e2e8f0;background:#0a1628;line-height:1.7">
        <h1 style="font-size:2rem;font-weight:800;color:#fff;margin-bottom:16px">
          Penguin City Builder — Build Your Arctic Metropolis
        </h1>
        <p style="font-size:1.1rem;color:#94a3b8;margin-bottom:24px">
          Build and grow your own penguin metropolis! Place buildings, hatch citizens,
          manage resources, and climb the global leaderboard in this free browser city-builder game.
        </p>
        <ul style="color:#cbd5e1;padding-left:20px;margin-bottom:24px">
          <li><strong>Build</strong> — Place igloos, cafés, shops, and facilities on a 20×20 arctic grid</li>
          <li><strong>Grow</strong> — Hatch penguin citizens and watch your population thrive</li>
          <li><strong>Manage</strong> — Balance coins, fish, ice, wood, and energy resources</li>
          <li><strong>Compete</strong> — Submit your city score to the global leaderboard</li>
          <li><strong>Save</strong> — Cloud save and resume your city any time</li>
        </ul>
        <p style="color:#64748b;font-size:0.9rem">
          Penguin City Builder requires JavaScript. Please enable JavaScript in your browser to play.
        </p>
